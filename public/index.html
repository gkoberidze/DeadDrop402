<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeadDrop402</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-mono min-h-screen p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-emerald-400">DeadDrop402</h1>
        <p class="text-sm text-slate-400">ავტონომიური M2M მონაცემთა ბაზა</p>
      </div>
      <div class="flex items-center space-x-2 bg-emerald-950/60 text-emerald-400 text-xs font-semibold px-3 py-1.5 rounded-full border border-emerald-800/60">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>SERVER ACTIVE</span>
      </div>
    </div>

    <!-- Details Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl">
        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Target Endpoint</span>
        <code class="text-sm font-bold text-emerald-400 bg-slate-950 px-2 py-1 rounded border border-slate-800">GET /api/v1/deaddrop/intel</code>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl">
        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Recipient Wallet</span>
        <code id="recipient-wallet" class="text-xs font-semibold text-slate-300 break-all">Loading...</code>
      </div>
    </div>

    <!-- Live Protocol Events Monitor -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-bold text-slate-200 tracking-wide uppercase">Live Protocol Events</h2>
        <span class="text-xs text-slate-500">Polling every 1s</span>
      </div>
      <div id="logs-container" class="space-y-3 min-h-[200px]">
        <div class="text-sm text-slate-500 italic">Waiting for agent requests...</div>
      </div>
    </div>

  </div>

  <script>
    async function fetchLogs() {
      try {
        const res = await fetch('/api/v1/logs');
        const data = await res.json();
        
        if (data.serverPubkey) {
          document.getElementById('recipient-wallet').innerText = data.serverPubkey;
        }

        const container = document.getElementById('logs-container');
        if (data.logs.length === 0) {
          container.innerHTML = '<div class="text-sm text-slate-500 italic">Waiting for agent requests...</div>';
          return;
        }

        container.innerHTML = data.logs.map(log => {
          let badgeClass = "bg-slate-800 text-slate-300 border-slate-700";
          if (log.type === "HTTP_402_INTERCEPT") badgeClass = "bg-amber-950/60 text-amber-400 border-amber-800/60";
          if (log.type === "VERIFYING_TX") badgeClass = "bg-blue-950/60 text-blue-400 border-blue-800/60";
          if (log.type === "PAYLOAD_UNLOCKED") badgeClass = "bg-emerald-950/60 text-emerald-400 border-emerald-800/60";

          return `
            <div class="p-3.5 bg-slate-950 border border-slate-800 rounded-lg flex items-start justify-between text-xs space-x-3">
              <div class="flex items-center space-x-2">
                <span class="text-slate-500 font-semibold">[${log.time}]</span>
                <span class="font-bold px-2 py-0.5 rounded border ${badgeClass}">${log.type}</span>
              </div>
              <pre class="text-slate-400 font-mono text-right overflow-x-auto max-w-md">${JSON.stringify(log.details)}</pre>
            </div>
          `;
        }).join('');
      } catch (e) {
        console.error("Failed to fetch logs", e);
      }
    }

    setInterval(fetchLogs, 1000);
    fetchLogs();
  </script>
</body>
</html>
