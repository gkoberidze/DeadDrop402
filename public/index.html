<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeadDrop402</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-mono min-h-screen p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-emerald-400">DeadDrop402</h1>
        <p class="text-sm text-slate-400">ავტონომიური M2M მონაცემთა ბაზა</p>
      </div>
      <div class="flex items-center space-x-2 bg-emerald-950/60 text-emerald-400 text-xs font-semibold px-3 py-1.5 rounded-full border border-emerald-800/60">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>SERVER ACTIVE</span>
      </div>
    </div>

    <!-- Details Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl">
        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Target Endpoint</span>
        <code class="text-sm font-bold text-emerald-400 bg-slate-950 px-2 py-1 rounded border border-slate-800">GET /api/v1/deaddrop/intel</code>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl">
        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Recipient Wallet</span>
        <code id="recipient-wallet" class="text-xs font-semibold text-slate-300 break-all">Loading...</code>
      </div>
    </div>

    <!-- Live Protocol Events Monitor -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-bold text-slate-200 tracking-wide uppercase">Live Protocol Events</h2>
        <span class="text-xs text-slate-500">Polling every 1s</span>
      </div>
      <div id="logs-container" class="space-y-3 min-h-[200px]">
        <div class="text-sm text-slate-500 italic">Waiting for agent requests...</div>
      </div>
    </div>

  </div>

  <script>
    const badgeClasses = {
      HTTP_402_INTERCEPT: "bg-amber-950/60 text-amber-400 border-amber-800/60",
      VERIFYING_TX: "bg-blue-950/60 text-blue-400 border-blue-800/60",
      PAYLOAD_UNLOCKED: "bg-emerald-950/60 text-emerald-400 border-emerald-800/60",
    };

    function showEmptyState(container) {
      const message = document.createElement("div");
      message.className = "text-sm text-slate-500 italic";
      message.textContent = "Waiting for agent requests...";
      container.replaceChildren(message);
    }

    async function fetchLogs() {
      try {
        const res = await fetch('/api/v1/logs');
        if (!res.ok) throw new Error(`Log request failed with HTTP ${res.status}`);
        const data = await res.json();
        
        if (typeof data.serverPubkey === "string") {
          document.getElementById('recipient-wallet').textContent = data.serverPubkey;
        }

        const container = document.getElementById('logs-container');
        if (!Array.isArray(data.logs) || data.logs.length === 0) {
          showEmptyState(container);
          return;
        }

        const entries = data.logs.map(log => {
          const row = document.createElement("div");
          row.className = "p-3.5 bg-slate-950 border border-slate-800 rounded-lg flex items-start justify-between text-xs space-x-3";

          const heading = document.createElement("div");
          heading.className = "flex items-center space-x-2";

          const time = document.createElement("span");
          time.className = "text-slate-500 font-semibold";
          time.textContent = `[${String(log.time ?? "")}]`;

          const type = document.createElement("span");
          const eventType = String(log.type ?? "");
          const badgeClass = Object.prototype.hasOwnProperty.call(badgeClasses, eventType)
            ? badgeClasses[eventType]
            : "bg-slate-800 text-slate-300 border-slate-700";
          type.className = `font-bold px-2 py-0.5 rounded border ${badgeClass}`;
          type.textContent = eventType;
          heading.append(time, type);

          const details = document.createElement("pre");
          details.className = "text-slate-400 font-mono text-right overflow-x-auto max-w-md";
          details.textContent = JSON.stringify(log.details ?? null);

          row.append(heading, details);
          return row;
        });
        container.replaceChildren(...entries);
      } catch (e) {
        console.error("Failed to fetch logs", e);
      }
    }

    setInterval(fetchLogs, 1000);
    fetchLogs();
  </script>
</body>
</html>
